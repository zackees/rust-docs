name: Ingest release

# ---------------------------------------------------------------------------
# Thin dispatcher: takes a single Rust version triple and delegates every
# real step to scripts/ingest.py -- no logic lives in this YAML (repo
# convention: non-trivial logic lives in scripts/*.py, the workflow is
# orchestration only).
#
# Committing source/<version>/ to main triggers build-site.yml (push
# trigger), which hash-gates the recompile to just this release's index.db.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Rust release triple, e.g. 1.95.0"
        required: true
        type: string
  repository_dispatch:
    types: [ingest]

permissions:
  contents: write

concurrency:
  group: ingest-${{ github.event.inputs.version || github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Create venv + install deps
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python pyyaml
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Resolve version input
        id: version
        run: |
          set -eu
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${{ github.event.client_payload.version }}"; fi
          if [ -z "$V" ]; then echo "::error::no version provided"; exit 1; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Ingest ${{ steps.version.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ingest.py "${{ steps.version.outputs.value }}"

      - name: Commit source snapshot + catalog
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "source/${{ steps.version.outputs.value }}" source/index.json
          if git diff --cached --quiet; then
            echo "nothing to commit (already ingested)"
            exit 0
          fi
          git commit -m "ingest: snapshot Rust ${{ steps.version.outputs.value }}"
          git push origin HEAD:main
